version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: keepalive_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite+aiosqlite:////data/keepalive.db
      - SQLITE_WAL_MODE=true
      - SECRET_KEY=cvale_keepalive_secret_change_me
      - DEADMAN_TIMEOUT_SECONDS=90
      - HEARTBEAT_TOLERANCE_FAILS=3
      - TELEGRAM_BOT_TOKEN=
      - TELEGRAM_CHAT_ID=
    volumes:
      - sqlite_data:/data
    # Restricao estrita de recursos para VPS de baixo custo (512MB/1GB RAM)
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          memory: 32M

volumes:
  sqlite_data:

