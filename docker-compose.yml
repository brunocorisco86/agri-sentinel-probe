services:
  keepalive-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: keepalive-api
    restart: unless-stopped
    ports:
      - "8016:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/keepalive.db
      - API_SECRET_TOKEN=${API_SECRET_TOKEN:-keepalive-secret-token-123}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - DEADMAN_INTERVAL_SECONDS=10
      - DEADMAN_TIMEOUT_SECONDS=30
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
